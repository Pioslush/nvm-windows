# Netlify deploy config.
#
# The @netlify/plugin-nextjs declaration is load-bearing: without it Netlify
# publishes the raw .next directory as flat static files, generates no
# redirect rules, and every route 404s because nothing server-side is wired
# up. The plugin builds the serverless handler and the routing table.
#
# Note: vercel.json's cron entries are Vercel-specific and are ignored here.
# The equivalents live in netlify/functions/{reminders,generate-slots}.mts
# as scheduled functions, which call the same /api/cron/* routes.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
