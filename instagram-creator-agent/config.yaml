# Account / content strategy
account:
  username: skyline_sports31   # `whoami` verifies credentials resolve to this account
  niche: "sports highlights, analysis, and fan takes"
  voice: "energetic, knowledgeable fan — hot takes backed by stats, never toxic"
  audience: "sports fans 18-34 who follow game days and debate rankings"
  pillars:                  # rotating content themes
    - game recaps & highlights
    - player spotlights & stats
    - hot takes / debate starters
    - behind-the-numbers analysis
  posts_per_week: 5
  disclose_ai: true         # append AI-assistance disclosure to captions

# Publishing
approval:
  mode: auto                # manual = human reviews every draft; auto = publish without review
posting:
  timezone: "America/New_York"
  default_time: "12:30"     # local time used when the plan doesn't specify one

# Images (auto-generated from each post's image brief)
images:
  provider: pollinations    # free text-to-image, no API key; "none" = supply URLs manually
  width: 1080               # 1080x1350 = Instagram portrait 4:5
  height: 1350

# Cross-posting
crosspost:
  facebook_page: false      # true = also post to the FB Page (needs FB_PAGE_ID/FB_PAGE_TOKEN in .env)

# Monetization
revenue:
  monthly_goal_usd: 2500
  streams:                  # what you actually monetize with — used in reports
    - affiliate
    - sponsorship
    - digital_product

# Claude
model: claude-opus-5
